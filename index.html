#stars-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.glifo-caido{position:absolute;top:-10%;font-family:'Fredoka One',cursive;color:var(--amarillo);opacity:0.16;animation:caer linear infinite;will-change:transform;}
@keyframes caer{
  0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
  8%{opacity:0.22;}
  92%{opacity:0.18;}
  100%{transform:translateY(115vh) translateX(var(--drift,20px)) rotate(360deg);opacity:0;}
}

.screen{display:none;position:relative;z-index:2;min-height:100vh;padding:20px;}
.active{display:block;}
#menu.active{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}

.logo-flotante{font-size:4.4rem;margin-bottom:4px;animation:flotar 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,215,0,0.55));}
.avatar-coach{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid rgba(0,229,255,0.55);box-shadow:0 0 30px rgba(0,229,255,0.45),0 0 55px rgba(255,215,0,0.25);animation:flotar 3.6s ease-in-out infinite;margin-bottom:6px;}
@keyframes flotar{0%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}100%{transform:translateY(0) rotate(-2deg);}}
.titulo-juego{font-family:'Fredoka One',cursive;font-size:2.9rem;background:linear-gradient(to bottom,#FFD700,#ff6d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 10px rgba(255,109,0,0.5));margin:4px 0;}
.subtitulo{font-family:'Fredoka One',cursive;font-size:1rem;color:#b3e5fc;margin-bottom:14px;}
.autores-box{background:rgba(255,255,255,0.1);border:1px solid rgba(255,215,0,0.35);border-radius:14px;padding:8px 20px;margin:8px 0 16px;font-size:0.8rem;color:#e1f5fe;backdrop-filter:blur(6px);}

.btn-menu{padding:14px 40px;margin:8px;cursor:pointer;border:none;border-radius:50px;font-family:'Fredoka One',cursive;font-size:1.15rem;box-shadow:0 6px 20px rgba(0,0,0,0.4);transition:all 0.2s;}
.btn-alumno{background:linear-gradient(135deg,#00c853,#00e676);color:#003300;}
.btn-docente{background:linear-gradient(135deg,#ff6d00,#ffab40);color:#1a0000;}
.btn-menu:hover{transform:translateY(-3px) scale(1.04);}

.form-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,0.2);border-radius:24px;padding:26px 20px;max-width:520px;margin:16px auto;}
.form-card h2{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--amarillo);margin-bottom:14px;}
input[type=text]{padding:12px 16px;margin:6px;border-radius:50px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:white;font-size:1rem;font-weight:700;width:calc(50% - 14px);outline:none;}
input[type=text]::placeholder{color:rgba(255,255,255,0.55);}
input[type=text]:focus{border-color:var(--cyan);}
.input-full{width:100%!important;}

.modo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.btn-modo{padding:14px 8px;border:3px solid transparent;border-radius:14px;font-family:'Fredoka One',cursive;font-size:0.98rem;cursor:pointer;}
.btn-modo small{display:block;font-family:'Nunito';font-weight:700;font-size:0.68rem;margin-top:3px;opacity:0.85;}
.btn-modo.selected{border-color:white;box-shadow:0 0 0 3px rgba(255,255,255,0.4);}
.m-tildes{background:linear-gradient(135deg,#2196f3,#64b5f6);color:#0d47a1;}
.m-orto{background:linear-gradient(135deg,#e91e63,#f48fb1);color:#3e0028;}
.m-estudio{background:linear-gradient(135deg,#4caf50,#81c784);color:#1b5e20;}
.m-reto{background:linear-gradient(135deg,#ff5722,#ff8a65);color:#3e0000;}

.label-mini{font-size:0.75rem;color:#b3e5fc;font-weight:700;text-align:left;margin:10px 0 -4px 4px;}
.codigo-wrap{background:rgba(0,229,255,0.1);border:2px dashed rgba(0,229,255,0.4);border-radius:14px;padding:10px 14px;margin:10px 0;}

.btn-iniciar{padding:15px 50px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--amarillo),var(--naranja));color:#1a0000;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;margin-top:10px;}
.btn-accion{padding:11px 24px;border:none;border-radius:50px;font-family:'Fredoka One',cursive;font-size:0.95rem;cursor:pointer;margin:5px 4px;}
.btn-volver{background:linear-gradient(135deg,#546e7a,#90a4ae);color:white;}
.btn-guardar{background:linear-gradient(135deg,#00c853,#69f0ae);color:#003300;}

#juego{padding:14px;max-width:560px;margin:0 auto;}
.hud{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.35);border-radius:50px;padding:10px 20px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.15);}
.hud-vidas{color:#ff6b6b;font-family:'Fredoka One',cursive;font-size:1.05rem;}
.hud-score{color:var(--amarillo);font-family:'Fredoka One',cursive;}
.hud-modo{color:var(--cyan);font-size:0.78rem;font-weight:700;}
.combo-display{font-family:'Fredoka One',cursive;font-size:1.15rem;min-height:30px;color:var(--naranja);text-shadow:0 0 14px rgba(255,109,0,0.9);animation:comboPulse 0.35s ease-out;}
@keyframes comboPulse{0%{transform:scale(1.5);}100%{transform:scale(1);}}
.timer-bar-wrap{width:100%;background:rgba(0,0,0,0.3);border-radius:50px;overflow:hidden;height:12px;border:1px solid rgba(255,255,255,0.2);margin:8px 0;}
.timer{height:12px;background:linear-gradient(90deg,#00e5ff,#00b0ff);width:100%;transition:width 0.1s linear;}
.progreso-reto{font-size:0.78rem;color:#b3e5fc;font-weight:700;margin-bottom:4px;}

.palabra-card{background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));border:2px solid rgba(255,255,255,0.3);border-radius:20px;padding:20px;margin:10px 0;backdrop-filter:blur(8px);}
.palabra-display{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.1rem;letter-spacing:1px;word-break:break-word;color:#ffffff;text-shadow:0 2px 8px rgba(0,0,0,0.4);}
.cat-badge{display:inline-block;padding:5px 16px;border-radius:50px;font-size:0.76rem;font-weight:900;letter-spacing:1px;background:rgba(255,215,0,0.2);color:var(--amarillo);border:1px solid rgba(255,215,0,0.4);margin-top:8px;}
.explicacion-cat{font-size:0.8rem;color:#b3e5fc;margin-top:8px;font-style:italic;min-height:18px;}

.opciones-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.opt{padding:14px 8px;border:2px solid rgba(255,255,255,0.25);border-radius:14px;background:rgba(255,255,255,0.12);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1.15rem;cursor:pointer;word-break:break-word;}
.opt:hover:not(:disabled){background:rgba(255,255,255,0.25);border-color:rgba(255,255,255,0.6);}
.opt:disabled{cursor:default;}
.correct{background:linear-gradient(135deg,#00c853,#69f0ae)!important;border-color:#00c853!important;}
.incorrect{background:linear-gradient(135deg,#d50000,#ff5252)!important;border-color:#d50000!important;}
.show-correct{background:linear-gradient(135deg,#1565c0,#42a5f5)!important;border-color:#42a5f5!important;}

#feedback{font-family:'Fredoka One',cursive;font-size:1.15rem;min-height:28px;margin:4px 0;}
.explicacion-box{background:rgba(0,0,0,0.32);border-left:3px solid var(--cyan);border-radius:12px;padding:12px 16px 12px 80px;font-size:0.86rem;color:#e1f5fe;text-align:left;line-height:1.5;min-height:64px;position:relative;}
.explicacion-box b{color:var(--amarillo);}
.explicacion-box .silabas{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--cyan);letter-spacing:2px;display:block;margin:6px 0;}
.explicacion-box::before{content:'';position:absolute;left:12px;top:12px;width:56px;height:56px;border-radius:50%;background-image:var(--avatar-mini);background-size:cover;background-position:center;border:2px solid var(--cyan);box-shadow:0 0 12px rgba(0,229,255,0.55);}
.btn-siguiente{background:linear-gradient(135deg,var(--morado),#b388ff);color:white;padding:12px 30px;border:none;border-radius:50px;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;margin-top:8px;display:none;}

.final-card{background:rgba(0,0,0,0.35);border:2px solid rgba(255,215,0,0.4);border-radius:24px;padding:26px 20px;max-width:460px;margin:16px auto;}
.score-grande{font-family:'Fredoka One',cursive;font-size:3.6rem;color:var(--amarillo);text-shadow:0 0 30px rgba(255,215,0,0.6);}
.calif-grande{font-family:'Fredoka One',cursive;font-size:1.6rem;color:#69f0ae;margin:6px 0;}
.diagnostico-txt{color:#b3e5fc;font-size:0.95rem;margin:8px 0;font-weight:700;}

.panel-wrap{max-width:1000px;margin:0 auto;padding:16px;}
.panel-title{font-family:'Fredoka One',cursive;font-size:1.7rem;color:var(--amarillo);margin-bottom:14px;}
.sesion-panel{background:rgba(0,229,255,0.08);border:2px solid rgba(0,229,255,0.25);border-radius:14px;padding:14px;margin-bottom:16px;text-align:left;}
.sesion-panel label{font-size:0.8rem;color:#b3e5fc;font-weight:700;display:block;margin-bottom:4px;}
.codigo-grande{font-family:'Fredoka One',cursive;font-size:1.9rem;color:var(--amarillo);letter-spacing:6px;background:rgba(0,0,0,0.35);padding:8px 20px;border-radius:12px;display:inline-block;margin:6px 0;}
.tabla-wrap{overflow-x:auto;margin-bottom:18px;}
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;font-size:0.82rem;}
th{background:rgba(0,0,0,0.4);padding:9px 6px;font-family:'Fredoka One',cursive;font-size:0.78rem;color:var(--amarillo);}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.08);color:#e1f5fe;}
tr.top10{background:rgba(255,215,0,0.14);}
.ranking-card{background:rgba(255,255,255,0.07);border-radius:16px;padding:14px;margin:14px 0;text-align:left;}
.ranking-item{display:flex;justify-content:space-between;padding:6px 12px;border-radius:8px;margin:4px 0;font-weight:700;}
.btn-export{padding:11px 22px;border:none;border-radius:50px;font-family:'Fredoka One',cursive;font-size:0.9rem;cursor:pointer;margin:4px;}
.btn-exp-csv{background:linear-gradient(135deg,#8bc34a,#aed581);color:#1b3300;}
.btn-limpiar{background:linear-gradient(135deg,#f44336,#ef9a9a);color:#1a0000;}
.btn-gen-codigo{background:linear-gradient(135deg,#7c4dff,#b388ff);color:white;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border-radius:50px;padding:12px 28px;font-family:'Fredoka One',cursive;font-size:0.9rem;z-index:9999;}
.combo-splash{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);font-family:'Fredoka One',cursive;font-size:2.6rem;color:var(--naranja);text-shadow:0 0 30px rgba(255,109,0,0.8);pointer-events:none;z-index:500;animation:splashshoot 0.8s ease-out forwards;}
@keyframes splashshoot{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5);}60%{opacity:1;transform:translate(-50%,-60%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-80%) scale(0.9);}}
</style>
</head>
